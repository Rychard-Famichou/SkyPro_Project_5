services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  web:
    image: ${DOCKER_HUB_USERNAME}/myapp:${IMAGE_TAG:-latest}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: ${DOCKER_HUB_USERNAME}/myapp-nginx:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web

  celery:
    image: ${DOCKER_HUB_USERNAME}/myapp:${IMAGE_TAG:-latest}
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    image: ${DOCKER_HUB_USERNAME}/myapp:${IMAGE_TAG:-latest}
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  pg_data:
  redis_data:
  static_volume:
